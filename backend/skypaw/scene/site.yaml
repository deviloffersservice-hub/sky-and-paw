# Sky & Paw site geometry (SPEC v1.2 §4 Site/grid, §6.3; values copied from the approved
# mockup engine docs/mockups/ops-v2.html, "site geometry" block).
#
# FRAMES
#   site frame  = the mockup / console frame (three.js): x east, y UP, z south; metres.
#                 Ground plane is y = 0. Every position in this file is in the site frame
#                 unless the key says otherwise. RUBBLE rows are (x, z, sx, sy, sz, yaw):
#                 centre on the ground at (x, z), size sx (along x) * sy (height) * sz
#                 (along z), yaw in radians about +y (three.js rotation.y).
#   world frame = Cyberwave / MuJoCo: X east, Y north, Z UP (right-handed); metres.
#   site -> world:  X = x,  Y = -z,  Z = y;  yaw_world (about +Z) = yaw_site (about +y).
#   (skypaw.scene.geometry.site_to_world implements this; tests pin it.)
#
# The mockup also tilts each slab by rotation.z = yaw * 0.25 for looks; the GLB keeps every
# box level (boxes only, flat on the ground) so the collision geometry matches the grid.
version: 1

footprint: {x_min: -9.0, x_max: 9.0, z_min: -6.0, z_max: 6.0}   # 18 x 12 m

grid: {x0: -13.0, z0: -9.0, cell: 0.5, w: 52, h: 36}             # occupancy grid (SPEC §4)

staging: {x: -12.5, z: 7.5}                                      # STAGING W

rubble:
  # x,    z,    sx,  sy,   sz,  yaw   (slabs)
  - [-5.0, -3.0, 6.0, 0.35, 4.0, 0.2]
  - [1.0, -3.5, 5.0, 0.3, 3.5, -0.15]
  - [-2.0, 2.5, 5.0, 0.3, 4.0, 0.1]
  - [-6.5, 3.5, 3.5, 0.3, 3.0, 0.35]
  - [7.0, -4.0, 3.0, 0.3, 3.0, 0.05]
  - [7.5, 3.5, 2.5, 0.3, 4.0, -0.3]
  - [0.5, 1.0, 3.0, 0.3, 2.5, 0.6]
  # standing walls
  - [-9.0, 0.0, 0.3, 2.8, 6.0, 0.0]
  - [-3.0, -6.0, 5.0, 2.2, 0.3, 0.0]
  - [9.0, -2.0, 0.3, 1.8, 5.0, 0.0]
  # debris blocks
  - [-7.0, -1.0, 1.2, 1.0, 1.4, 0.4]
  - [-3.5, -0.5, 1.0, 0.8, 1.0, 0.9]
  - [2.0, -5.0, 1.5, 0.9, 1.2, 0.3]
  - [-1.0, 4.5, 1.1, 1.2, 1.0, 0.7]
  - [6.0, 1.5, 1.0, 0.7, 1.3, 0.2]
  - [-5.0, 5.0, 0.9, 0.6, 0.9, 0.1]
  - [1.5, 4.2, 1.3, 0.8, 0.9, -0.5]
  - [-8.0, -4.5, 1.2, 1.5, 1.0, 0.3]

# Ground truth for the synthetic sensors (SPEC §3.2). pos = (x, y, z) in the site frame.
victims:
  - id: V-01
    pos: [3.5, 0.5, -2.0]
    where: Under slab edge, ground-floor stairwell
    language: mr-IN
    truth: {rgb: 0.91, thermal: 5.8, radar: {bpm: 64, snr: strong}, co2: 420}
  - id: V-02
    pos: [-4.0, 0.6, 3.0]
    where: Beneath first-floor slab, east room, 1.1 m void
    language: hi-IN
    deteriorates: true
    truth: {thermal: 3.1, radar: {bpm: 71, snr: weak}, co2: 380}
  - id: V-03
    pos: [7.0, 0.5, 4.8]
    where: South-west corner, partial occlusion
    language: mr-IN
    truth: {rgb: 0.64}
  - id: D-01
    pos: [-7.5, 0.4, -5.2]
    where: North-west edge, sheet-metal pile
    language: hi-IN
    decoy: true
    truth: {thermal: 9.2}

# Drone lawnmower survey (SPEC §6.3 / §9): five passes at 6 m, 2.5 m apart, 2.2 m/s.
survey: {x0: -8.0, x1: 8.0, rows: [-5.0, -2.5, 0.0, 2.5, 5.0], alt: 6.0, speed: 2.2}

# Spawn poses (site frame). The drone must spawn above ground: at world Z = 0 every
# Skydio X2 camera renders black (RESEARCH §6), so y = 0.6.
spawn:
  drone: {pos: [-11.5, 0.6, 5.5], yaw: 0.0}
  go2: {pos: [-11.0, 0.0, 7.5], yaw: 0.0}
  rubble: {pos: [0.0, 0.0, 0.0], yaw: 0.0}

# Optional M1-A6 push test (scripts/scene.py --push-test): the Go2 starts 1.0 m west of the
# x = -9 wall (west face at x = -9.15) facing east, then move_forward(0.5, duration=2).
push_test:
  go2: {pos: [-10.0, 0.0, 0.0], yaw: 0.0}

glb:
  # Vertex frame written into rubble.glb. Cyberwave's MuJoCo import uses GLB vertex
  # coordinates as world Z-up metres (day-one round 2, run R2-3: boxes authored z-up rendered
  # upright and the rubble twin's MQTT z stayed at ground level), so the builder writes world
  # coordinates and does NOT apply the glTF y-up convention. "gltf_y_up" writes site-frame
  # (y-up) vertices instead, in case a later Cyberwave release honours the glTF convention.
  vertex_frame: world_z_up
