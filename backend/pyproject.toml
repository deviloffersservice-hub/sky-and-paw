[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skypaw"
dynamic = ["version"]
description = "Sky & Paw: simulation-only drone + quadruped search-and-rescue ops console (backend)."
requires-python = ">=3.11"
# Exact pins. backend/requirements.txt (runtime) and backend/requirements-dev.txt
# (runtime + dev) are the full locks generated from this file with pip-compile;
# regenerate them with `make lock` after changing anything here.
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "cyberwave==0.7.4",
    "sarvamai==0.1.41",
    "numpy==1.26.4; python_version < '3.13'",
    # numpy 1.26.x ships no CPython 3.13 wheels; 2.1.3 is the nearest release that does.
    "numpy==2.1.3; python_version >= '3.13'",
    "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
]
# Heavy and optional for T0: installed by `make setup-ml` from backend/requirements-ml.txt
# (torch CPU wheels from https://download.pytorch.org/whl/cpu).
ml = [
    "ultralytics==8.3.253",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.setuptools.dynamic]
version = { attr = "skypaw.__version__" }

[tool.setuptools.packages.find]
include = ["skypaw*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # starlette 0.46 TestClient on anyio 4.1x: harmless deprecation inside starlette itself.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
