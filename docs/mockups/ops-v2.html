<title>Sky &amp; Paw Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<style>
/* Layout: map is the product. Slim header (clocks, triage counts, EVERYONE OUT). The stage fills the rest: tactical map, camera tiles bottom-left (tap → focus), decision queue top-right, voice strip bottom-centre, a context panel that slides in from the right only when something is selected. Log / layers / timeline / 3D hide behind small toolbar buttons. Single dark theme. */
:root{

  color-scheme:dark;
}
html,body{height:100%}

button,select,input{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--fg-2)} .btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600} .btn.ghost{background:transparent} .btn.tiny{padding:2px 6px;font-size:11px} .btn[disabled]{opacity:.4;cursor:not-allowed} .btn.on{border-color:var(--accent);color:var(--accent);background:rgba(255,159,28,.1)} .btn.danger{background:var(--bad);color:#2a0000;border-color:var(--bad);font-weight:700}
.sel{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:4px 7px;max-width:100%}
.chip{display:inline-block;padding:2px 7px;border-radius:3px;font:600 10.5px/1.4 var(--display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap} .chip.life{color:var(--bad);border-color:var(--bad)} .chip.bad{color:var(--bad);border-color:var(--bad)} .chip.r-medic{color:var(--medic);border-color:var(--medic)} .chip.r-extraction{color:var(--extraction);border-color:var(--extraction)} .chip.r-lead{color:var(--lead);border-color:var(--lead)}
.dim{color:var(--muted)} .bad{color:var(--bad)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 20px/1 var(--display);letter-spacing:.04em;color:var(--accent)} .brand small{display:block;font:500 10px/1 var(--display);letter-spacing:.14em;color:var(--fg-2);margin-top:3px}
.site{border-left:1px solid var(--line);padding-left:14px;font-size:12px;color:var(--fg-2)} .site b{display:block;font:600 14px/1.2 var(--display);letter-spacing:.03em;color:var(--fg)}

.tri{display:flex;gap:1px;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto} .tri span{padding:3px 10px;background:var(--panel-2);text-align:center;min-width:58px} .tri b{display:block;font:600 18px/1 var(--display);font-variant-numeric:tabular-nums} .tri small{display:block;font:600 9px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);margin-top:3px} .tri .imm b{color:var(--bad)} .tri .del b{color:var(--warn)} .tri .ext b{color:var(--good)}
.teamdots{display:flex;gap:4px} .td{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--display);color:var(--bg);position:relative} .td.r-medic{background:var(--medic)} .td.r-extraction{background:var(--extraction)} .td.r-lead{background:var(--lead);border-radius:5px} .td.lost{background:var(--muted);outline:2px dashed var(--bad);outline-offset:1px} .td i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;border:2px solid var(--panel);background:var(--muted)} .td.moving i{background:var(--info)} .td.working i{background:var(--good)}

.pop{position:absolute;left:10px;top:44px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;display:none;gap:4px;flex-direction:column;min-width:170px;box-shadow:0 12px 32px rgba(0,0,0,.5)} .pop.on{display:flex} .pop label{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 4px;cursor:pointer} .pop .lg{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--fg-2);padding:2px 4px} .pop .lg i{width:10px;height:10px;border-radius:2px;display:inline-block} .pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.dec.k-cutoff,.dec.k-mandown,.dec.k-deteriorate{border-left-color:var(--bad)} .dec.k-request,.dec.k-newvictim{border-left-color:var(--team)} .dec.k-speak{border-left-color:var(--good)} .dec.k-warn{border-left-color:var(--warn)} .dec.k-proposal{border-left-color:var(--info)}
.dec-h{display:flex;justify-content:space-between;font:600 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)} .dec-t{font:600 15px/1.2 var(--display);letter-spacing:.02em} .dec-b{margin:0;font-size:12px;color:var(--fg-2)} .dec-a{display:flex;gap:5px;flex-wrap:wrap} .dec-a .btn{font-size:12px;padding:5px 9px}
.qmore{font-size:11.5px;color:var(--fg-2);text-align:right} .qcalm{font:600 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 2px}
.cams{position:absolute;left:10px;bottom:68px;display:flex;gap:6px;z-index:4;flex-wrap:wrap;max-width:60%} .cam{position:relative;width:200px;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer} .cam.pinned{border-color:var(--warn)} .cam canvas{position:absolute;inset:0;width:100%;height:100%} .cam .lbl{position:absolute;right:6px;bottom:5px;font:600 10px/1 var(--display);letter-spacing:.1em;color:var(--fg-2);text-transform:uppercase}
.stage.focus .cams{inset:10px 10px 68px 10px;max-width:none;display:block} .stage.focus .cam{display:none} .stage.focus .cam.focus{display:block;width:100%;height:100%;aspect-ratio:auto;border-color:var(--accent)} .stage.focus .cam.focus .lbl{font-size:13px;right:12px;bottom:12px}

.vtext{min-width:0;display:grid;gap:1px} .vtext .line{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px} .vtext .line .partial::after{content:"▍";color:var(--accent);animation:blink .8s infinite} @keyframes blink{50%{opacity:.3}} .vtext .sub{font-size:11px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .vtext .sub b{color:var(--team);font-weight:600}

.pick-h{font:600 13px/1 var(--display);letter-spacing:.04em} .pick-sec{font:600 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);margin-top:4px;display:flex;justify-content:space-between} .pick-sec small{text-transform:none;letter-spacing:0;font:400 11px var(--body);color:var(--muted)} .pick-row{display:flex;gap:5px;flex-wrap:wrap} .pick-row.end{justify-content:flex-end;margin-top:4px}

.cpanel{position:absolute;right:0;top:0;bottom:0;width:372px;max-width:100%;z-index:6;background:rgba(17,24,32,.97);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;overflow:auto;padding:12px 14px} .stage.panel .cpanel{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px} .vid{font:700 20px/1 var(--display);letter-spacing:.04em} .where{margin:6px 0 0;font-size:12px;color:var(--fg-2)}
.triage{display:grid;grid-template-columns:repeat(4,1fr);gap:4px} .tbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:6px 4px;font:600 12px/1.1 var(--display);letter-spacing:.04em;cursor:pointer;display:grid;gap:3px} .tbtn small{font:400 9.5px var(--body);color:var(--muted)} .tbtn.sugg{border-style:dashed} .tbtn.on.t-immediate{background:var(--bad);color:#2a0000;border-color:var(--bad)} .tbtn.on.t-delayed{background:var(--warn);color:#2a1a00;border-color:var(--warn)} .tbtn.on.t-unknown,.tbtn.on.t-expectant{background:var(--fg-2);color:var(--bg);border-color:var(--fg-2)} .tbtn.on small{color:inherit;opacity:.75}

.phrases{display:grid;grid-template-columns:1fr 1fr;gap:5px} .phrases .btn{text-align:left;font-size:12px;padding:6px 8px} .phrases .btn small{display:block;color:var(--fg-2);font-size:11px;margin-top:2px;line-height:1.3}

.ovl{position:absolute;inset:0;z-index:12;background:rgba(5,8,12,.6);display:none;align-items:center;justify-content:center;padding:20px} .ovl.on{display:flex} .ovl-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(880px,100%);max-height:100%;overflow:auto;padding:14px 16px;display:grid;gap:10px} .ovl-h{display:flex;justify-content:space-between;align-items:center} .ovl-h h2{font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}

  };

  /* ---------- camera POV tiles: drone / go2 / team body cam ---------- */

<script>

    const tb=$('#ttsBadge'); if(S.tts.playing){tb.classList.add('on'); tb.innerHTML=`<b>Go2 speaking · ${SP.langName(S.tts.playing.lang)} · ${S.tts.playing.voice}</b>${SP.esc(S.tts.playing.text)}`;} else tb.classList.remove('on');
    // context panel
    const sel=S.selected; const st=$('#stage'); if(sel){ st.classList.add('panel'); closePick(); let html=''; if(sel.kind==='victim'){const v=S.victims.find(x=>x.id===sel.id); html=v?SP.ui.victimPanel(v):'';} else if(sel.kind==='team') html=SP.ui.teamPanel(SP.member(sel.id)); else if(sel.kind==='hazard'){const h=S.hazards.find(x=>x.id===sel.id); html=h?SP.ui.hazardPanel(h):'';} else html=SP.ui.botPanel(sel.kind); const active=document.activeElement; const keep=active&&cp.contains(active)&&active.tagName==='INPUT'?{sel:active.dataset.msg!==undefined?'[data-msg]':'[data-relay]',val:active.value}:null; cp.innerHTML=html; if(keep){const i=cp.querySelector(keep.sel); if(i){i.value=keep.val; i.focus();}} } else { st.classList.remove('panel'); }
    syncCams(); if($('#ovlTimeline').classList.contains('on'))renderTimeline(); if($('#ovlLog').classList.contains('on'))renderLog(); renderPhone();
  }
  SP.onFrame(()=>{ const t=S.t|0; $('#stT').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); const since=SP.SITE.collapseMinAgo*60+t; $('#stSince').textContent=String(since/3600|0)+':'+String((since/60|0)%60).padStart(2,'0')+':'+String(since%60).padStart(2,'0'); });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePick(); SP.select(null); $('#layersPop').classList.remove('on'); $('#vmore').classList.remove('on'); document.querySelectorAll('.ovl.on').forEach(o=>o.classList.remove('on'));}});
  render();
})();
</script>
