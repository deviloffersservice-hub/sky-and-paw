name: Pages

# Deploys the console (frontend only) to GitHub Pages:
#   https://deviloffersservice-hub.github.io/<repo>/  (sky-and-paw -> /sky-and-paw/)
# The backend runs in a Codespace; open the console with ?api=<codespace URL> once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # enablement: true turns Pages on (source: GitHub Actions) on the first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Project Pages are served under /<repo>/: /sky-and-paw/ for the sky-and-paw repository.
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          echo "VITE_BASE=$VITE_BASE"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
