name: Pages

# Deploys the console (frontend only) to GitHub Pages:
#   https://deviloffersservice-hub.github.io/<repo>/  (sky-and-paw -> /sky-and-paw/)
# The backend runs in a Codespace; open the console with ?api=<codespace URL> once.
# Actions are pinned to full commit SHAs (tag in the trailing comment).
on:
  push:
    branches: [main, claude/spec-and-mockup]  # the second is the repo default branch; the github-pages environment only deploys from it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Project Pages are served under /<repo>/: /sky-and-paw/ for the sky-and-paw repository.
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          echo "VITE_BASE=$VITE_BASE"
          npm run build

      # The landing page is the approved interactive demo; the backend console shell moves to /app.html.
      - name: Build demo landing page
        run: python3 scripts/build_demo_page.py frontend/dist

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true turns Pages on (source: GitHub Actions) on the first run. If the token
      # may not do that, set Settings -> Pages -> Source = GitHub Actions once and re-run.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
