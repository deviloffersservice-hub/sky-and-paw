name: Voice check (Sarvam live)
# Manual: runs the Sarvam day-one checks with the repository's Actions secret, cost ≈ ₹0.31.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: |
          if [ -z "$SARVAM_API_KEY" ]; then echo "::error::SARVAM_API_KEY is not set as an Actions secret (Settings → Secrets and variables → Actions)"; exit 2; fi
          python -c "import hashlib,os;print('key sha256 prefix', hashlib.sha256(os.environ['SARVAM_API_KEY'].encode()).hexdigest()[:12])"
          pip install -q sarvamai==0.1.41 websockets httpx
          cd scripts/checks/sarvam && mkdir -p out
          python rest.py tr && python rest.py stt && python rest.py llm && python rest.py tts && python probe.py && python c1_ws.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sarvam-check-out
          path: scripts/checks/sarvam/out

  # skypaw.voice end to end with the real key: translate, plan, TTS, REST STT, realtime STT.
  # ≈ ₹0.3, every call < ₹1; stops at the first 402. Independent of the job above.
  voice_live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: make setup
        run: make setup PYTHON=python
      - name: voice_check.py --live
        # The runner context is only available at step level, not in job-level env.
        env:
          DATA_DIR: ${{ runner.temp }}/data
        run: |
          if [ -z "$SARVAM_API_KEY" ]; then echo "::error::SARVAM_API_KEY is not set as an Actions secret"; exit 2; fi
          mkdir -p "$DATA_DIR/voice_check"
          SKYPAW_SARVAM_LIVE=1 .venv/bin/python scripts/voice_check.py --live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: voice-check-live
          path: ${{ runner.temp }}/data/voice_check
